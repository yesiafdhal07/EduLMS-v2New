<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klolakelas — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #0a0a0f;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
    }
    h1 { font-size: 1.75rem; font-weight: 900; letter-spacing: -0.03em; }
    p { color: #64748b; font-size: 0.95rem; max-width: 320px; line-height: 1.6; }
    button {
      margin-top: 0.5rem;
      padding: 0.75rem 2rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4f46e5; }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="icon">🎓</div>
  <div>
    <p class="badge">Klolakelas</p>
    <h1>Sedang Offline</h1>
  </div>
  <p>Koneksi internet tidak tersedia. Beberapa fitur mungkin terbatas, namun data yang sudah tersimpan tetap bisa diakses.</p>
  <button onclick="window.location.reload()">🔄 Coba Lagi</button>
</body>
</html>
